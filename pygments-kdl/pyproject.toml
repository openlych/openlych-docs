[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdl-pygments"
version = "0.1.0"
description = "Pygments lexer for KDL, used by the OpenLych docs"
requires-python = ">=3.8"

[project.entry-points."pygments.lexers"]
kdl = "kdl_pygments:KdlLexer"
